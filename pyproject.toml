[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decoder-compress"
version = "0.1.0"
description = "Configurable decoder width compression and recovery training"
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "einops>=0.7", "PyYAML>=6", "numpy>=1.24", "opencv-python>=4.8"]

[project.optional-dependencies]
perceptual = ["lpips>=0.1.4"]
test = ["pytest>=8"]

[project.scripts]
decoder-compress = "decoder_compress.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
