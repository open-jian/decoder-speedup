version: 1
model:
  adapter: wan22
  source: /data2/jian/vae-speedup/Wan2.2
  weights: /data2/jian/vae-speedup/assets/wan22/Wan2.2_VAE.pth
  init: teacher_prefix
width:
  stages:
  - 512
  - 512
  - 256
  - 64
  - 32
  hidden: {}
data:
  root: /data2/jian/vae-speedup/datasets/vidgen-1m
  train_manifest: /data2/jian/vae-speedup/experiments/20261001_wan22_width_turbo/manifests/train.jsonl
  val_manifest: /data2/jian/vae-speedup/experiments/20261001_wan22_width_turbo/manifests/val.jsonl
  frames: 17
  height: 256
  width: 256
  frame_stride: 1
  batch_size: 1
  horizontal_flip: true
loss:
  l1: 1.0
  lpips: 1.0
  feature: 1.0
  features:
  - middle
  - upsamples.0
  gan: 0.05
  adaptive_gan: true
training:
  seed: 42
  reconstruction_updates: null
  reconstruction_epochs: 100
  adversarial_updates: 0
  accumulation: 8
  discriminator_updates: 1
  lr_schedule: constant
  learning_rate: 0.0001
  discriminator_lr: 0.0001
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.0001
  epsilon: 1.0e-15
  ema_decay: 0.999
  gradient_clip: 1.0
  save_every: 1000
  eval_every: 1000
  eval_clips: 16
  discriminator_channels: 32
runtime:
  device: cuda:0
  precision: bf16
  weight_dtype: fp32
  channels_last: false
  compile: false
wandb:
  enabled: true
  entity: miaoyin-uta
  project: vae-speedup
  mode: online
  group: wan22-width-recovery
  tags:
  - data:vidgen-1m
  - schedule:turbo-public
  - subset:train10k-val256
  - campaign:first-recovery
  log_every: 50
  system_sample_seconds: 30
  name: wan22-amd-width-turbo-10k-20261001
output: /data2/jian/vae-speedup/decoder-speedup/runs/wan22-amd-width-turbo-10k-20261001
