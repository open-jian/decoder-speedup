# AMD v1/v3 stage widths on the original Wan2.2 decoder (width-only).
# Width source/mapping: docs/AMD_WIDTH.md. Recovery recipe is not yet validated.
# Set WAN22_SOURCE, WAN22_WEIGHTS, VIDGEN_ROOT, MANIFEST_DIR, RUN_DIR first.
version: 1
model:
  adapter: wan22
  source: ${WAN22_SOURCE}
  weights: ${WAN22_WEIGHTS}
  init: teacher_prefix
width:
  # entry/middle, up0, up1, up2, final RGB-resolution stage
  # Original: [1024, 1024, 1024, 512, 256]. AMD v1/v3 both use the following widths.
  stages: [512, 512, 256, 64, 32]
  hidden: {}  # No additional custom block-internal compression.
data:
  root: ${VIDGEN_ROOT}
  train_manifest: ${MANIFEST_DIR}/train.jsonl
  val_manifest: ${MANIFEST_DIR}/val.jsonl
  frames: 17
  height: 256
  width: 256
  frame_stride: 1
  batch_size: 1
  horizontal_flip: true
loss:
  l1: 1.0
  lpips: 1.0
  feature: 1.0
  features: [middle, upsamples.0]
  gan: 0.05
  adaptive_gan: true
training:
  seed: 42
  # Starter values to edit; authors' final Wan width-recovery recipe is not known.
  reconstruction_updates: 20000
  adversarial_updates: 0
  accumulation: 1
  discriminator_updates: 1
  learning_rate: 1.0e-4
  discriminator_lr: 1.0e-4
  betas: [0.9, 0.95]
  weight_decay: 1.0e-4
  epsilon: 1.0e-8
  ema_decay: 0.999
  gradient_clip: 1.0
  save_every: 1000
  eval_every: 1000
  eval_clips: 16
  discriminator_channels: 32
runtime:
  device: cuda:0
  precision: bf16
  weight_dtype: fp32  # FP32 master weights + BF16 AMP; inference may use bf16 weights
  channels_last: false
  compile: false
output: ${RUN_DIR}
